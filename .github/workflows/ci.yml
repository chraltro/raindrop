name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - name: Import check
        run: python -c "import sys; sys.path.insert(0,'pipeline'); import riverrunner.cli, riverrunner.hydro, riverrunner.climate; print('pipeline imports OK')"
